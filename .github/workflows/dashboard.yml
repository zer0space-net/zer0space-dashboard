name: Build dashboard image

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'static/**'
      - 'templates/**'
      # The Dockerfile COPYs this in too (it's the break-glass unlock tool,
      # meant to run via `docker exec` inside the built container) — a change
      # here was silently not rebuilding the image at all until this line was
      # added. If you add another top-level directory the Dockerfile COPYs,
      # it needs a line here too, or the same thing happens again.
      - 'scripts/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/dashboard.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'requirements.txt'
  workflow_dispatch:

# Least privilege by default. Without this the token inherits the repository
# default, which on older repos is still read/write on every scope — and the
# check job below runs `pip install` against the PR's own requirements.txt,
# which executes arbitrary code from a package's build backend. The build job
# re-grants packages: write for itself.
permissions:
  contents: read

jobs:
  # Cheap guardrails. There is no test suite yet, so this is what stands between
  # a typo and a container that crash-loops on the cluster: the whole package has
  # to import, and every template has to parse.
  check:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to commit SHAs, not to moving major tags:
      # a tag is repointable by whoever controls the action's repository, and the
      # build job below holds a token that can write to the container registry.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Byte-compile all sources
        run: python -m compileall -q src scripts

      - name: Import the application
        # DB_HOST points nowhere on purpose — importing must not need a database.
        env:
          DB_HOST: 127.0.0.1
          SESSION_SECRET: ci-only-not-a-real-secret
        run: python -c "from src.main import app; print(f'{len(app.routes)} routes registered')"

      - name: Parse every Jinja template
        run: |
          python - <<'PY'
          from jinja2 import Environment, FileSystemLoader
          from pathlib import Path
          env = Environment(loader=FileSystemLoader("templates"))
          for path in sorted(Path("templates").glob("*.html")):
              env.get_template(path.name)
              print(f"ok  {path.name}")
          PY

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # GITHUB_TOKEN, not CR_PAT — the fix this file's previous comment asked for.
      #
      # CR_PAT was a long-lived classic PAT that sat live in this job's
      # environment, and on 2026-09-09 it silently expired: every build since
      # failed at this step with "denied: denied", so the GHCR image quietly
      # went stale while main kept moving. A credential that has to be rotated
      # by hand is a deploy that breaks on a date nobody has written down.
      #
      # GITHUB_TOKEN is minted per run and cannot expire.
      #
      # The old comment here claimed GITHUB_TOKEN could not work because this
      # GHCR package predates the repository and was never linked to it. That
      # was wrong: the switch worked on the first run with no package setting
      # touched. The package is owned by the same org as this repo, which is
      # enough. Do not reintroduce a PAT on the strength of that old claim.
      #
      # If this step ever does fail with "denied", check the package's
      # "Manage Actions access" list before suspecting a credential:
      #   github.com/orgs/zer0space-net/packages/container/zer0space-dashboard/settings
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/zer0space-net/zer0space-dashboard:latest
            ghcr.io/zer0space-net/zer0space-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
