<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zer0space — Register</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/img/may-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/img/may-64.png">
  <link rel="apple-touch-icon" href="/img/may-180.png">
  <link rel="preload" as="image" href="/img/may-256.jpg">
  <style>
    :root {
      --accent:      #0a84ff;
      --accent-glow: rgba(10,132,255,0.25);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      background: #030304;
      color: rgba(255,255,255,0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    #star-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(ellipse 60% 50% at 12% 8%, rgba(255,255,255,0.05) 0%, transparent 70%),
        radial-gradient(ellipse 45% 45% at 90% 92%, rgba(255,255,255,0.035) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 360px;
      margin: 20px;
      background: rgba(10,10,11,0.80);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 36px 32px 32px;
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      box-shadow: 0 40px 100px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04);
      animation: cardIn 0.4s cubic-bezier(0.4,0,0.2,1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(18px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .logo { text-align: center; margin-bottom: 28px; }
    .logo-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      animation: logoIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
      border-radius: 50%;
    }
    .logo-mark img {
      display: block;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.10), 0 10px 30px rgba(0,0,0,0.55);
    }
    @keyframes logoIn {
      from { opacity: 0; transform: scale(0.7) rotate(-8deg); }
      to   { opacity: 1; transform: scale(1) rotate(0); }
    }
    .logo h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
    .logo p { font-size: 13px; color: rgba(255,255,255,0.38); margin-top: 3px; }

    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.40);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .form-group input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 11px;
      padding: 11px 14px;
      color: rgba(255,255,255,0.92);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.18s, background 0.18s;
    }
    .form-group input:focus {
      border-color: color-mix(in srgb, var(--accent) 60%, transparent);
      background: rgba(255,255,255,0.07);
    }
    .form-group input::placeholder { color: rgba(255,255,255,0.18); }
    .form-group .hint { font-size: 11px; color: rgba(255,255,255,0.30); margin-top: 5px; }

    .btn {
      width: 100%;
      margin-top: 8px;
      background: #000;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 11px;
      padding: 13px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s, transform 0.18s, box-shadow 0.18s;
      user-select: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.55);
    }
    .btn:hover {
      background: #0b0b0e;
      border-color: rgba(255,255,255,0.30);
      transform: translateY(-1px);
      box-shadow: 0 8px 26px rgba(0,0,0,0.65);
    }
    .btn:active { transform: none; background: #000; }
    .btn:focus-visible { outline: 2px solid rgba(255,255,255,0.55); outline-offset: 2px; }
    .btn:disabled {
      opacity: 0.45;
      cursor: default;
      transform: none;
      box-shadow: none;
      border-color: rgba(255,255,255,0.10);
    }

    .error-msg {
      margin-top: 14px;
      padding: 10px 14px;
      background: rgba(255,69,58,0.12);
      border: 1px solid rgba(255,69,58,0.25);
      border-radius: 10px;
      font-size: 13px;
      color: #ff6b6b;
      text-align: center;
      display: none;
    }
    .error-msg.visible { display: block; animation: shake 0.35s ease; }

    .success-msg {
      margin-top: 14px;
      padding: 10px 14px;
      background: rgba(48,209,88,0.12);
      border: 1px solid rgba(48,209,88,0.25);
      border-radius: 10px;
      font-size: 13px;
      color: #30d158;
      text-align: center;
      display: none;
    }
    .success-msg.visible { display: block; }

    .lang-toggle {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 3;
      display: flex;
      height: 32px;
      padding: 3px;
      gap: 2px;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0.65;
      transition: opacity 0.2s, background 0.2s, border-color 0.2s;
    }
    .lang-toggle:hover, .lang-toggle:focus-within {
      opacity: 1;
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.12);
    }
    .lang-btn {
      display: flex;
      align-items: center;
      padding: 0 11px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: rgba(255,255,255,0.40);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.18s, color 0.18s;
    }
    .lang-btn:hover { color: rgba(255,255,255,0.75); }
    .lang-btn:focus-visible { outline: 1px solid rgba(255,255,255,0.45); outline-offset: 1px; }
    .lang-btn.active { background: rgba(255,255,255,0.10); color: rgba(255,255,255,0.95); }

    @media (max-height: 700px) {
      .lang-toggle { position: static; margin: 22px auto 0; opacity: 1; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-5px); }
      40%       { transform: translateX(5px); }
      60%       { transform: translateX(-4px); }
      80%       { transform: translateX(4px); }
    }
  </style>
</head>
<body>
  <canvas id="star-canvas" aria-hidden="true"></canvas>

  <div class="card">
    <div class="logo">
      <div class="logo-mark">
        <img src="/img/may-256.jpg" width="88" height="88"
             data-i18n-alt="login.logoAlt" alt="May, das zer0space-Maskottchen">
      </div>
      <h1 data-i18n="register.title">Konto erstellen</h1>
      <p data-i18n="register.subtitle">Mit Einladungscode registrieren</p>
    </div>

    <form id="registerForm" novalidate>
      <div class="form-group">
        <label for="inviteCode" data-i18n="register.inviteCode">Einladungscode</label>
        <input id="inviteCode" name="inviteCode" type="text" autocomplete="off"
               placeholder="a1b2c3…" required autofocus>
      </div>
      <div class="form-group">
        <label for="username" data-i18n="login.username">Benutzername</label>
        <input id="username" name="username" type="text" autocomplete="username"
               placeholder="max" required>
      </div>
      <div class="form-group">
        <label for="password" data-i18n="login.password">Passwort</label>
        <input id="password" name="password" type="password" autocomplete="new-password"
               placeholder="••••••••••••" required minlength="12">
        <div class="hint" data-i18n="register.pwHint">Mindestens 12 Zeichen</div>
      </div>
      <button type="submit" class="btn" id="submitBtn" data-i18n="register.submit">Registrieren</button>
      <div class="error-msg" id="errorMsg" data-i18n="register.invalid">Registrierung fehlgeschlagen</div>
      <div class="success-msg" id="successMsg" data-i18n="register.success">Konto erstellt — du kannst dich jetzt anmelden.</div>
    </form>

    <p style="text-align:center;margin-top:18px;font-size:13px;color:rgba(255,255,255,0.38)">
      <span data-i18n="register.haveAccount">Schon ein Konto?</span>
      <a href="/login" style="color:rgba(255,255,255,0.65)" data-i18n="register.loginLink">Anmelden</a>
    </p>
  </div>

  <div class="lang-toggle" role="group" data-i18n-aria="top.language">
    <button type="button" class="lang-btn" data-lang="de">DE</button>
    <button type="button" class="lang-btn" data-lang="en">EN</button>
  </div>

  <script src="/i18n.js"></script>
  <script src="/register.js"></script>
  <script src="/starfield.js" defer></script>
</body>
</html>
